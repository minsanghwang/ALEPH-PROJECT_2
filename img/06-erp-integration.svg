<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 760" width="1420" height="760" role="img" aria-label="구역 6 · ERP와 데이터센터 연동" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1420" height="760" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">구역 6 · ERP와 데이터센터 연동</text>
<rect x="20" y="56" width="1380" height="340" rx="14" fill="#e8f4fb" stroke="#6cb0d6" stroke-width="1.5" />
<text x="34" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">본사 업무 시스템 (ERP)</text>
<rect x="20" y="416" width="1380" height="300" rx="14" fill="#eef2ff" stroke="#8b9bd8" stroke-width="1.5" />
<text x="34" y="440" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">외부 데이터센터 (VPN 너머)</text>
<rect x="40" y="110" width="180" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="130" y="142.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">직원 브라우저</text><text x="130" y="159.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">HTTPS · 역할별 메뉴</text><text x="130" y="176.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">(직원·담당자·관리자)</text>
<rect x="260" y="110" width="170" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="345" y="142.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">WAF</text><text x="345" y="159.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">ModSecurity</text><text x="345" y="176.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">TLS 종단</text>
<rect x="470" y="90" width="430" height="240" rx="9" fill="#fff" stroke="#2f7fb0" stroke-width="2.2" /><text x="685" y="163.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">ERP-WEB (Apache + PHP 8.0)</text><text x="685" y="180.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">상품 · 재고 · 거래처 · 단가 · 구매 요청/발주/결재</text><text x="685" y="197.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">쇼핑몰 주문·환불 · 쇼핑몰 재고 · 물류 재고 화면</text><text x="685" y="214.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">보안: 서버 측 권한 검사 · CSRF 토큰 · 세션 쿠키 보안 속성</text><text x="685" y="231.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">입력은 매개변수화 쿼리, 출력은 인코딩</text><text x="685" y="248.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">상품 이미지 업로드: 확장자·내용·크기 검사, 웹 루트 밖 저장</text><text x="685" y="265.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">모든 변경은 감사 기록(DB + syslog)</text>
<rect x="960" y="110" width="200" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1060" y="142.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IT-DB</text><text x="1060" y="159.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">MariaDB hq_erp</text><text x="1060" y="176.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">표별 최소 권한 계정</text>
<rect x="960" y="230" width="200" height="80" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1060" y="257.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">이미지 저장소</text><text x="1060" y="274.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">/var/lib/erp/uploads</text><text x="1060" y="291.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">웹 루트 밖 · 직접 접근 404</text>
<rect x="1190" y="110" width="190" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1285" y="142.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">LogSRV (SIEM)</text><text x="1285" y="159.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">감사 이벤트 → 경보</text><text x="1285" y="176.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">DB 계정 변경·로그인 실패</text>
<path d="M220 155 L260 155" fill="none" stroke="#6b7280" stroke-width="1.8"  marker-end="url(#ar)"/>
<path d="M430 155 L470 155" fill="none" stroke="#6b7280" stroke-width="1.8"  marker-end="url(#ar)"/>
<path d="M900 155 L960 155" fill="none" stroke="#6b7280" stroke-width="1.8"  marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="909.2" y="145" width="41.6" height="19" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="0.8" opacity="0.95"/>
<text x="930" y="159" text-anchor="middle" font-size="11.5" fill="#1f2937">3306</text>
<path d="M900 270 L960 270" fill="none" stroke="#6b7280" stroke-width="1.8"  marker-end="url(#ar)"/>
<path d="M1160 155 L1190 155" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<rect x="1146.8" y="145" width="56.400000000000006" height="19" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="0.8" opacity="0.95"/>
<text x="1175" y="159" text-anchor="middle" font-size="11.5" fill="#1f2937">syslog</text>
<rect x="470" y="450" width="430" height="150" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="685" y="495.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">서비스 DC (쇼핑몰)</text><text x="685" y="512.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">연동 API :3000 · 헤더 X-Service-Key(파일로만 보관)</text><text x="685" y="529.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">읽기: 주문·환불·상품·재고</text><text x="685" y="546.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">쓰기: 상품 수정, 환불 승인·거절, 주문 취소</text><text x="685" y="563.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">쓰기는 상대에 먼저 요청 → 다시 읽어 확인 → ERP 반영</text>
<rect x="960" y="450" width="400" height="150" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="1160" y="495.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">물류 DC (재고 시스템 WMS)</text><text x="1160" y="512.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">HTTP API · 헤더 X-Service-Key(ERP 전용 키)</text><text x="1160" y="529.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">읽기 전용: 재고 · 출고 · 반품 조회</text><text x="1160" y="546.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">재고 수정은 물류 직원만(ERP는 보기 전용)</text><text x="1160" y="563.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">실패 시 "조회 실패" 카드만 표시, 다른 기능 영향 없음</text>
<rect x="60" y="480" width="360" height="100" rx="9" fill="#ffffff" stroke="#c0463f" stroke-width="1.6" /><text x="240" y="509" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IPsec VPN (pfSense)</text><text x="240" y="526" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">con1 → 서비스 DC · con2 → 물류 DC</text><text x="240" y="543" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">허용은 ERP-WEB 주소에서 필요한 포트만</text><text x="240" y="560" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">반대 방향(상대 → 본사)은 기본 차단</text>
<path d="M685 330 L685 450" fill="none" stroke="#c0463f" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="649.4" y="380" width="71.2" height="19" rx="4" fill="#ffffff" stroke="#c0463f" stroke-width="0.8" opacity="0.95"/>
<text x="685" y="394" text-anchor="middle" font-size="11.5" fill="#1f2937">VPN con1</text>
<path d="M860 330 L860 380 L1160 380 L1160 450" fill="none" stroke="#c0463f" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="974.4" y="370" width="71.2" height="19" rx="4" fill="#ffffff" stroke="#c0463f" stroke-width="0.8" opacity="0.95"/>
<text x="1010" y="384" text-anchor="middle" font-size="11.5" fill="#1f2937">VPN con2</text>
<text x="24" y="744" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">원칙: 연동 결과를 확인하기 전에는 성공으로 표시하지 않는다(상대의 상태가 원본). 키는 화면·로그·보고서에 내보내지 않는다.</text>
</svg>
