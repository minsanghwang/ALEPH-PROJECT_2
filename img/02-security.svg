<rect x="290" y="490" width="280" height="100" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="430" y="527.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IDS (Suricata, 패시브)</text><text x="430" y="544.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">WAN 구간의 TAP 허브에서 복사한</text><text x="430" y="561.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">트래픽을 탐지만 한다(차단 안 함)</text>
<rect x="590" y="490" width="280" height="100" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="730" y="519" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">호스트 방화벽</text><text x="730" y="536" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">firewalld / ufw + Apache 접근 제한</text><text x="730" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버마다 필요한 출발지만 허용</text><text x="730" y="570" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">관리 NIC는 SSH 출발지 제한</text>
<rect x="890" y="490" width="300" height="100" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="1040" y="519" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">유출 통제</text><text x="1040" y="536" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">허용 목록 방식(본문 검사 없음)</text><text x="1040" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">금지 목적지는 Suricata 시그니처</text><text x="1040" y="570" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">(LEAK-DEST)로 경보</text>
<rect x="1210" y="490" width="270" height="100" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="1345" y="519" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">관측</text><text x="1345" y="536" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">ModSecurity · Squid · pfSense · IPS</text><text x="1345" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">로그가 모두 LogSRV로 모여</text><text x="1345" y="570" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Wazuh 규칙으로 경보</text>
<text x="24" y="636" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">설계 원칙: 한 장비에 모든 것을 맡기지 않고 경계(pfSense), 웹(WAF), 단말 웹(SWG), 서버(호스트 방화벽)의 여러 겹으로 막고, 막은 사실도 기록으로 남긴다.</text>
