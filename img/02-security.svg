<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" role="img" aria-label="구역 2 · 보안 계층: 방화벽, IPS/IDS, WAF, SWG" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
