<text x="34" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">사용자</text>
<rect x="270" y="56" width="940" height="400" rx="14" fill="#ffeceb" stroke="#e08a85" stroke-width="1.5" />
