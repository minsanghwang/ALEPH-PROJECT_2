<rect x="40" y="190" width="190" height="130" rx="9" fill="#ffffff" stroke="#4b9a63" stroke-width="1.6" /><text x="135" y="234" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">직원 PC</text><text x="135" y="251" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">부서 VLAN</text><text x="135" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">업무 웹: 사내 도메인</text><text x="135" y="285" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">일반 웹: 프록시 자동 설정(WPAD)</text>
<rect x="290" y="100" width="180" height="96" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="380" y="127" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Core ACL</text><text x="380" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">WAF-PROTECT</text><text x="380" y="161" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">WAF로 가는 443·80만 허용</text><text x="380" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">그 밖의 직접 접근 차단</text>
<rect x="500" y="100" width="210" height="96" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="605" y="127" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">WAF</text><text x="605" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">nginx + ModSecurity(OWASP CRS)</text><text x="605" y="161" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">TLS 종단 · 차단 모드</text><text x="605" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">SQLi·XSS 요청은 403</text>
<rect x="500" y="330" width="210" height="96" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="605" y="357" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">SWG</text><text x="605" y="374" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Squid 프록시 + WPAD</text><text x="605" y="391" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">차단 목록 · 사설 대역 차단</text><text x="605" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">목적지 도메인 기록</text>
<rect x="750" y="100" width="170" height="326" rx="9" fill="#ffffff" stroke="#c0463f" stroke-width="2" /><text x="835" y="225" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IPS 인라인</text><text x="835" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">쌍 A</text><text x="835" y="259" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">pfSense e1 ↔ Transit_SW</text><text x="835" y="276" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472"></text><text x="835" y="293" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Suricata 사용자 규칙</text><text x="835" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">EVE 로그 → SIEM</text>
<rect x="960" y="100" width="220" height="326" rx="9" fill="#fff" stroke="#c0463f" stroke-width="2.4" /><text x="1070" y="199.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">pfSense 방화벽</text><text x="1070" y="216.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">인터페이스별 최소 허용</text><text x="1070" y="233.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">기본 차단 + 기록</text><text x="1070" y="250.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">(Egress default deny)</text><text x="1070" y="267.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472"></text><text x="1070" y="284.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">IPsec 탭: 필요한 포트만</text><text x="1070" y="301.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472"></text><text x="1070" y="318.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">사이트 간 VPN 종단</text><text x="1070" y="335.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">인터넷 방향 NAT</text>
<rect x="1245" y="100" width="220" height="70" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1355" y="131" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IPS 인라인 · 쌍 B</text><text x="1355" y="148" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">pfSense e3 ↔ LOG_SW</text>
<rect x="1245" y="200" width="220" height="96" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1355" y="227" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">ERP-WEB · IT-DB</text><text x="1355" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Apache는 WAF 주소만 허용</text><text x="1355" y="261" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">DB 3306은 ERP-WEB만</text><text x="1355" y="278" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버 구역 10.14.90.0/24</text>
<rect x="1245" y="330" width="220" height="96" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1355" y="357" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">인터넷</text><text x="1355" y="374" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">허용 목록 방식</text><text x="1355" y="391" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버는 직접 나갈 수 없음</text><text x="1355" y="408" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">SWG만 80·443 통과</text>
