<path d="M520 538 L590 380" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M520 620 L590 380" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M780 380 L780 420" fill="none" stroke="#6b7280" stroke-width="1.8"  />
