<rect x="992.9" y="240" width="34.2" height="19" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="0.8" opacity="0.95"/>
<text x="1010" y="254" text-anchor="middle" font-size="11.5" fill="#1f2937">SSH</text>
<path d="M1200 186 L1200 220" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<text x="24" y="726" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">로그는 서버의 관리 NIC를 통해 LogSRV로 전달되며(서비스 NIC 경로와 분리), 보낸 서버가 잠시 끊겨도 큐에 쌓였다가 도착한다.</text>
</svg>
