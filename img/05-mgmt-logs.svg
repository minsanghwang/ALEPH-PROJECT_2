<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-label="구역 5 · 관리, 로그, 백업: 관리망, SIEM, 백업, 시간 동기" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1400" height="760" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">구역 5 · 관리, 로그, 백업: 관리망, SIEM, 백업, 시간 동기</text>
<rect x="20" y="56" width="520" height="640" rx="14" fill="#fff9e0" stroke="#d9b84a" stroke-width="1.5" />
<text x="34" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">로그를 만드는 쪽</text>
<rect x="560" y="56" width="440" height="640" rx="14" fill="#f1ecfa" stroke="#a28ad6" stroke-width="1.5" />
<text x="574" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">수집 · 분석</text>
<rect x="1020" y="56" width="360" height="640" rx="14" fill="#f1ecfa" stroke="#a28ad6" stroke-width="1.5" />
<text x="1034" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">관리 · 백업</text>
<rect x="40" y="96" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="124" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">pfSense</text><text x="280" y="141" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">방화벽·VPN 이벤트 · syslog UDP 514</text>
<rect x="40" y="178" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="206" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IPS (Suricata)</text><text x="280" y="223" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">EVE JSON · rsyslog TCP 514</text>
<rect x="40" y="260" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="288" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">SWG (Squid)</text><text x="280" y="305" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">접속 기록(HTTPS는 도메인까지)</text>
<rect x="40" y="342" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="370" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">WAF</text><text x="280" y="387" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">nginx 접속·오류 · ModSecurity 차단 · 에이전트</text>
<rect x="40" y="424" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="452" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">ERP-WEB</text><text x="280" y="469" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Apache 로그 · 앱 감사 기록 · 에이전트</text>
<rect x="40" y="506" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="534" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IT-DB</text><text x="280" y="551" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Apache · MariaDB 오류·감사 · 에이전트</text>
<rect x="40" y="588" width="480" height="64" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="280" y="616" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">DNS-01</text><text x="280" y="633" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">BIND 질의 기록</text>
<rect x="590" y="130" width="380" height="250" rx="9" fill="#fff" stroke="#7d5fc4" stroke-width="2.2" /><text x="780" y="191.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">LogSRV (Wazuh 4.9.2)</text><text x="780" y="208.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.14.200.11 (관리망) · 10.14.210.11 (로그 구역)</text><text x="780" y="225.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">수집: rsyslog 514 / 에이전트 1514·1515</text><text x="780" y="242.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472"></text><text x="780" y="259.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">사용자 정의 탐지 규칙</text><text x="780" y="276.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">ERP 로그인 실패·반복·접근 거부 (100100~)</text><text x="780" y="293.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">WAF 차단·반복 차단, DB 접속 거부 (100110~)</text><text x="780" y="310.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">MariaDB 감사: 접속·DDL·계정 변경 (100200~)</text><text x="780" y="327.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">파일 무결성 변경(FIM) 경보</text>
<rect x="590" y="420" width="380" height="110" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="780" y="462.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">AI Agent의 입력</text><text x="780" y="479.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">알림 파일(alerts.json)을 읽기 전용으로 조회</text><text x="780" y="496.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">규칙 판정 + 문서 근거로 조사 보고서 작성</text>
<rect x="590" y="560" width="380" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="780" y="589" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">시간 동기</text><text x="780" y="606" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">pfSense가 외부 NTP(kr.pool, google, cloudflare)에 동기</text><text x="780" y="623" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버는 모두 pfSense를 기준으로 맞춘다</text><text x="780" y="640" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">재개·재기동한 VM은 시계를 먼저 확인</text>
<rect x="1040" y="96" width="320" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1200" y="128.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">MGMT_SW1 (관리망 중심)</text><text x="1200" y="145.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.14.200.0/24</text><text x="1200" y="162.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버마다 두 번째 NIC (.21 ~ .27)</text>
<rect x="1040" y="220" width="320" height="140" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1200" y="269" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">BackupSRV (.15)</text><text x="1200" y="286" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">점프 호스트: 서버 SSH는 여기서만</text><text x="1200" y="303" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">설정·DB 백업과 SHA-256 목록</text><text x="1200" y="320" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">복원 시험(임시 DB로 복원 후 행 수 비교)</text>
<rect x="1040" y="390" width="320" height="70" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1200" y="421" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">관리 PC (.101)</text><text x="1200" y="438" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">승인된 관리 단말</text>
<rect x="1040" y="490" width="320" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1200" y="520.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">접근 통제</text><text x="1200" y="537.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">SSH: 허용 사용자 목록 + 키 인증</text><text x="1200" y="554.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">인증 시도 3회 · X11 전달 끔</text><text x="1200" y="571.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">root는 키 인증만, 출발지 BackupSRV</text><text x="1200" y="588.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">파일 변경 감시: ERP·DB·WAF 에이전트</text>
