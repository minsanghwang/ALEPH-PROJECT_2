<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="구역 4 · 서버망: DHCP, DNS, 캐시 DNS, DB, ERP 웹" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1300" height="640" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">구역 4 · 서버망: DHCP, DNS, 캐시 DNS, DB, ERP 웹</text>
<rect x="20" y="56" width="1260" height="330" rx="14" fill="#fff9e0" stroke="#d9b84a" stroke-width="1.5" />
<text x="34" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">서버 구역 VLAN 490 · 10.14.90.0/24 (게이트웨이 = pfSense 10.14.90.1)</text>
<rect x="40" y="96" width="190" height="70" rx="9" fill="#ffffff" stroke="#c0463f" stroke-width="1.6" /><text x="135" y="127" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">pfSense · IPS 쌍 B</text><text x="135" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.14.90.1 (VLAN 490 게이트웨이)</text>
<rect x="40" y="200" width="190" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="135" y="229" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">SRV-AGG</text><text x="135" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버 접속 스위치</text><text x="135" y="263" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">로그 구역(LOG_SW)을 거쳐</text><text x="135" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">IPS 쌍 B → pfSense로 연결</text>
<path d="M135 166 L135 200" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<rect x="117.9" y="173" width="34.2" height="19" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="0.8" opacity="0.95"/>
<text x="135" y="187" text-anchor="middle" font-size="11.5" fill="#1f2937">트렁크</text>
<rect x="270" y="100" width="220" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="380" y="139" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">DHCP-Server .10</text><text x="380" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Rocky Linux 9</text><text x="380" y="173" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">직원 PC 주소 배포</text><text x="380" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">프록시 자동 설정 옵션</text>
<rect x="510" y="100" width="220" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="620" y="139" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">DNS-01 .12</text><text x="620" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Rocky Linux 9 · BIND</text><text x="620" y="173" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">사내 영역 hq.baliexpress.com</text><text x="620" y="190" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">erp·shop 이름 → WAF</text>
<rect x="750" y="100" width="240" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="870" y="130.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">CNS .13</text><text x="870" y="147.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">BIND 캐시·포워더</text><text x="870" y="164.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">사내 영역 → DNS-01</text><text x="870" y="181.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서비스 DC 도메인 → VPN 너머 DNS</text><text x="870" y="198.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">그 밖 → 외부 DNS</text>
<rect x="270" y="250" width="220" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="380" y="289" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IT-DB .11</text><text x="380" y="306" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Rocky Linux 9 · MariaDB</text><text x="380" y="323" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">ERP DB(hq_erp) · 감사 플러그인</text><text x="380" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">앱 계정은 표별 최소 권한</text>
<rect x="530" y="250" width="220" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="640" y="289" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">ERP-WEB .14</text><text x="640" y="306" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Rocky Linux 9 · Apache + PHP 8.0</text><text x="640" y="323" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">본사 업무 시스템</text><text x="640" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">로컬 DB 없음, IT-DB 사용</text>
<path d="M230 250 L250 250 L250 235 L870 235" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M380 235 L380 220" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M620 235 L620 220" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M870 235 L870 220" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M380 235 L380 250" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M640 235 L640 250" fill="none" stroke="#6b7280" stroke-width="1.8"  />
<path d="M490 310 L530 310" fill="none" stroke="#6b7280" stroke-width="1.8"  marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="510" y="394" font-size="12" font-weight="400" fill="#5b6472" text-anchor="middle">ERP-WEB → IT-DB :3306</text>
<rect x="40" y="420" width="400" height="130" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="240" y="455.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">서버 보호 (호스트 단)</text><text x="240" y="472.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">firewalld 허용 목록: IT-DB 3306은 ERP-WEB만,</text><text x="240" y="489.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">HTTP는 WAF 주소만. Apache도 Require ip로 한 번 더 제한</text><text x="240" y="506.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">관리 NIC는 SSH를 BackupSRV·관리 PC에서만 허용</text><text x="240" y="523.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">root 로그인은 키 인증만, 인증 시도 3회로 제한</text>
<rect x="470" y="420" width="400" height="130" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="670" y="455.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">DB 권한 설계</text><text x="670" y="472.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">앱 계정 erp_app: 접속 출발지 ERP-WEB 1곳</text><text x="670" y="489.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">표별 읽기·쓰기만, 감사 기록 표는 추가·조회만</text><text x="670" y="506.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">관리자 계정 생성·권한 부여·삭제는 감사 로그로 남겨</text><text x="670" y="523.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">SIEM 경보(규칙 100203)로 올라간다</text>
<rect x="900" y="420" width="380" height="130" rx="9" fill="#fff" stroke="#4b5563" stroke-width="1.6" /><text x="1090" y="455.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">요청이 서버까지 가는 길</text><text x="1090" y="472.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">직원 → WAF(ModSecurity) → pfSense·IPS</text><text x="1090" y="489.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">→ ERP-WEB(:80) → IT-DB(:3306)</text><text x="1090" y="506.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버 구역의 모든 통신이 방화벽과 IPS를 거친다</text><text x="1090" y="523.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">이름 확인은 직원 PC → CNS → DNS-01</text>
<text x="24" y="596" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">서버 정리: 복제로 만든 서버의 호스트 이름·SSH 호스트 키를 서버마다 새로 만들고, 이전 프로젝트의 DB와 계정은 백업 후 정리했다.</text>
<rect x="1010" y="96" width="330" height="86" rx="8" fill="#ffffff" stroke="#c9ced6"/>
<text x="1022" y="116" font-size="12.5" font-weight="700" fill="#1f2937">범례</text>
<line x1="1022" y1="130" x2="1062" y2="130" stroke="#6b7280" stroke-width="2.2" />
<text x="1072" y="134" font-size="12" fill="#1f2937">연결(L2·L3 링크)</text>
<line x1="1022" y1="147" x2="1062" y2="147" stroke="#8c6fcf" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1072" y="151" font-size="12" fill="#1f2937">복사·관리·VPN 터널</text>
<line x1="1022" y1="164" x2="1062" y2="164" stroke="#c0463f" stroke-width="2.2" />
<text x="1072" y="168" font-size="12" fill="#1f2937">보안 장비</text>
</svg>
