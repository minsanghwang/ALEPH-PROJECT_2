<rect x="40" y="100" width="290" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="185" y="137.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Wazuh 경보 (alerts.json)</text><text x="185" y="154.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">LogSRV의 실제 경보</text><text x="185" y="171.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">(옮긴 14건으로 실제 조사)</text>
<rect x="40" y="240" width="290" height="110" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="185" y="274" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">운영 문서(RAG 자료)</text><text x="185" y="291" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">정책표 v0.2 · 이전 판 v0.1</text><text x="185" y="308" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">구성도 설명 · 운영 절차(런북)</text><text x="185" y="325" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">절(##) 단위로 색인</text>
<rect x="40" y="390" width="290" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="185" y="427.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">사건 Memory</text><text x="185" y="444.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">과거 조사의 요약만 저장</text><text x="185" y="461.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">비밀값·원문은 저장하지 않음</text>
<rect x="40" y="530" width="290" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="185" y="567.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">자산 정보</text><text x="185" y="584.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">서버 이름·IP·역할·중요도</text><text x="185" y="601.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">이름 또는 IP로 조회</text>
<rect x="400" y="100" width="300" height="190" rx="9" fill="#ffffff" stroke="#2f7fb0" stroke-width="2" /><text x="550" y="157" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">MCP 서버 (읽기 전용)</text><text x="550" y="174" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">stdio · JSON-RPC 2.0</text><text x="550" y="191" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">siem_search_alerts · siem_get_alert</text><text x="550" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">xdr_classify · asset_lookup</text><text x="550" y="225" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">쓰기·삭제·실행 도구 없음</text><text x="550" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">응답 상한 50건 · 비밀값 가림</text>
<rect x="400" y="330" width="300" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="550" y="369" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">XDR 판정 (규칙 기반)</text><text x="550" y="386" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">무차별 대입 · 웹 공격 · 파일 변경</text><text x="550" y="403" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">DB 권한 변경 · 유출 시그니처</text><text x="550" y="420" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">block / alert / record + 확신도 + MITRE</text>
<rect x="730" y="100" width="310" height="190" rx="9" fill="#fff" stroke="#2f7fb0" stroke-width="2.2" /><text x="885" y="165.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Agent loop</text><text x="885" y="182.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">도구 선택 → 호출 → 관찰 반복</text><text x="885" y="199.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">실패 시 3회 재시도 · MCP 서버 재시작</text><text x="885" y="216.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">같은 호출 반복·허용 밖 요청은 거부</text><text x="885" y="233.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">3회 거부되면 조사 중단</text>
<rect x="730" y="330" width="310" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="885" y="377.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">판단 모델</text><text x="885" y="394.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Claude Messages API(tool_use)</text><text x="885" y="411.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">키 없이 쓰는 정해진 순서 계획기도 지원</text>
<rect x="400" y="490" width="640" height="150" rx="9" fill="#fff" stroke="#c0463f" stroke-width="1.6" /><text x="720" y="535.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">통제 (모든 호출의 앞뒤)</text><text x="720" y="552.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">도구 허용 목록 · 로그 속 지시문 탐지(데이터로만 취급) · 데이터 경계 표시</text><text x="720" y="569.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">키·토큰·비밀번호는 응답·보고서·Memory에 쓰기 전에 가림</text><text x="720" y="586.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">시각을 믿을 수 없는 경보(시계 틀어짐)는 시각 기반 판단을 하지 않음</text><text x="720" y="603.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">도구 결과에 없는 사실은 만들지 않음</text>
<rect x="1110" y="100" width="270" height="190" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1245" y="165.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">조사 보고서</text><text x="1245" y="182.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">판정 · 확신도 · MITRE</text><text x="1245" y="199.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">타임라인(같은 출발지의 경보)</text><text x="1245" y="216.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">근거 문서(이름·판·절)</text><text x="1245" y="233.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">도구 호출 기록</text>
<rect x="1110" y="330" width="270" height="120" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1245" y="377.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">불확실한 점</text><text x="1245" y="394.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">누락 필드 · 도구 실패 · 문서 값 충돌</text><text x="1245" y="411.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">시각 신뢰도 · 지시문 탐지</text>
<rect x="1110" y="490" width="270" height="150" rx="9" fill="#ffffff" stroke="#4b9a63" stroke-width="2.2" /><text x="1245" y="544" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">사람의 승인</text><text x="1245" y="561" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">차단·격리 같은 대응은</text><text x="1245" y="578" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Agent가 실행하지 않고</text><text x="1245" y="595" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">"승인 필요" 제안으로만 낸다</text>
