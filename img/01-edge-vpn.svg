<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="구역 1 · 외부와 경계: 인터넷, 지점 연결, VPN" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1240" height="700" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">구역 1 · 외부와 경계: 인터넷, 지점 연결, VPN</text>
