<text x="34" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">인터넷 쪽</text>
<rect x="400" y="56" width="430" height="620" rx="14" fill="#fff4e5" stroke="#e0a458" stroke-width="1.5" />
<text x="414" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">본사 경계</text>
<rect x="850" y="56" width="370" height="620" rx="14" fill="#eef2ff" stroke="#8b9bd8" stroke-width="1.5" />
<text x="864" y="80" font-size="15" font-weight="700" fill="#1f2937" opacity="0.9">지점 (VPN 상대)</text>
<rect x="50" y="96" width="300" height="54" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="200" y="119" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">인터넷</text><text x="200" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">GNS3 클라우드 → 호스트 PC 회선</text>
<rect x="50" y="200" width="300" height="70" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="200" y="222.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">ISP 라우터 (c3745)</text><text x="200" y="239.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Fa0/0 192.0.2.1/29</text><text x="200" y="256.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">인터넷 방향 NAT·기본 경로</text>
<rect x="50" y="330" width="300" height="90" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="200" y="354" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">시간 동기</text><text x="200" y="371" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">pfSense가 kr.pool.ntp.org, time.google.com</text><text x="200" y="388" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">time.cloudflare.com 에 동기</text><text x="200" y="405" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">모든 서버는 pfSense를 기준으로 동기</text>
<rect x="50" y="450" width="300" height="100" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="200" y="479" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">아웃바운드 NAT (hybrid)</text><text x="200" y="496" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.14.0.0/16 → em2 로 나갈 때</text><text x="200" y="513" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">192.0.2.2 로 주소 변환</text><text x="200" y="530" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">지점 방향은 WAN 경로로 고정</text>
<rect x="430" y="200" width="370" height="200" rx="9" fill="#fff" stroke="#c0463f" stroke-width="2.4" /><text x="615" y="253.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">pfSense 방화벽 · VPN 종단</text><text x="615" y="270.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">em0 WAN 10.14.0.2/30 (지점·VPN 방향)</text><text x="615" y="287.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">em2 ISP 192.0.2.2/29 (인터넷 방향)</text><text x="615" y="304.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">IPsec IKEv2: con1(서비스 DC), con2(물류 DC)</text><text x="615" y="321.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">교섭: AES-256 · SHA-256 · DH14 · NAT-T · DPD</text><text x="615" y="338.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">자식 SA: ESP AES-GCM-256</text><text x="615" y="355.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">인터페이스별 규칙 + IPsec 탭 규칙 (기본 차단)</text>
<rect x="430" y="450" width="370" height="76" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="615" y="475.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">WAN-EDGE (본사 경계 라우터)</text><text x="615" y="492.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">Fa0/0 203.0.113.26/29 · Fa0/1 10.14.0.1/30</text><text x="615" y="509.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">IKE(UDP 500/4500)·ESP를 pfSense로 정적 NAT</text>
<rect x="430" y="560" width="170" height="56" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="515" y="584" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">TAP 허브</text><text x="515" y="601" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">WAN 쪽 트래픽 복사</text>
<rect x="630" y="560" width="170" height="56" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="715" y="584" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">IDS (Suricata)</text><text x="715" y="601" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">패시브 탐지</text>
<rect x="880" y="450" width="310" height="76" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1035" y="475.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">WAN 라우터</text><text x="1035" y="492.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">3개 지점과 본사를 잇는 가운데 망</text><text x="1035" y="509.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">UDP 터널로 지점 클라우드에 연결</text>
<rect x="880" y="96" width="310" height="112" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1035" y="122.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">서비스 DC</text><text x="1035" y="139.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.10.0.0/16 · 쇼핑몰 + 연동 API</text><text x="1035" y="156.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">VPN 상대 198.51.100.10</text><text x="1035" y="173.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">본사 쪽 허용: ERP-WEB → API 3000, 웹 80</text><text x="1035" y="190.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">직원 웹 경유: SWG 10.14.0.37 → 쇼핑몰 80</text>
<rect x="880" y="238" width="310" height="112" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" /><text x="1035" y="264.5" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">물류 DC</text><text x="1035" y="281.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">10.20.0.0/16 · 재고(WMS) HTTP API</text><text x="1035" y="298.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">전용 링크 198.51.100.0/30</text><text x="1035" y="315.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">VPN 상대 198.51.100.20 (CARP, 문서용 대역)</text><text x="1035" y="332.5" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">본사 쪽 허용: ERP-WEB → WMS 80, ICMP</text>
<rect x="880" y="380" width="310" height="52" rx="9" fill="#ffffff" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1035" y="402" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">물류센터 10.40.0.0/16</text><text x="1035" y="419" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6472">VPN 설정 준비(비활성)</text>
